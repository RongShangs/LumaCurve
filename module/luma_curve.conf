# LumaCurve 1.0.0
config_version=11

# Slow local curve learning; offset remains only for legacy configuration compatibility.
preference_learning=1
preference_offset=0
preference_revision=0
curve_custom=0
curve_points=0.1,0.2,0.75,1.15,5.6,6.6,8.9,9.9,10.9,12.2,22,25,65,85

# Core response
alpha_fast=0.42
alpha_mid=0.18
alpha_slow=0.05
fast_threshold=1.1
slow_threshold=0.06
spike_up=12.0
spike_down=0.06
hyst_low=0.03
hyst_high=0.06

# Manual gamma, brighten/darken speed
manual_gamma=2.2
brighten_speed=1.0
darken_speed=1.0
min_step=4

# Extreme thermal hard protection only
thermal_cap_enable=1
thermal_hard_trigger=60000
thermal_hard_resume=55000
thermal_hard_floor_pct=0.20
charging_heat_guard=1

# Sunlight mode
high_lux_threshold=5000.0
high_lux_extreme_lux=30000.0
high_lux_boost_max=0.50
high_lux_min_pct=0.90
# 0 keeps sunlight enhancement active while lux, power and temperature remain safe.
high_lux_max_active_ms=0
high_lux_cooldown_ms=10000
high_lux_temp_thresh=52000
high_lux_temp_resume=48000
high_lux_bat_thresh=10
high_lux_hbm_enable=1
hbm_node_path=
hbm_on_value=1
hbm_off_value=0

# Log rotation
log_max_bytes=1048576
log_max_backups=2
# Rotated log archives are retained for 1-30 days.
# 0 disables age-based pruning; log_max_backups still limits disk usage.
log_retention_days=7

# Indoor temporal stability (0=legacy, 1=median + sustained direction confirmation)
# Scene adaptation (legacy key retained for saved configurations)
indoor_stability=1
